[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autotris"
version = "1.0.0"
description = "A tetris that plays itself, for the monitor you are not working on"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gabriel Utzig" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["tetris", "terminal", "tui", "ansi", "screensaver", "ambient"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Puzzle Games",
]

[project.urls]
Homepage = "https://github.com/Utzig26/autotris"
Source = "https://github.com/Utzig26/autotris"
Issues = "https://github.com/Utzig26/autotris/issues"

[project.scripts]
autotris = "autotris.cli:main"

[tool.setuptools.packages.find]
include = ["autotris*"]
